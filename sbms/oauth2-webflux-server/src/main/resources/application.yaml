server:
  port: 9000

spring:
  application:
    name: oauth2-webflux-server
  r2dbc:
    url: r2dbc:mysql://localhost:3306/oauth2db
    username: oauthuser
    password: oauthpass
  sql:
    init:
      mode: always
app:
  jwt:
    issuer: http://localhost:9000
    access-token-minutes: 15
    refresh-token-days: 7