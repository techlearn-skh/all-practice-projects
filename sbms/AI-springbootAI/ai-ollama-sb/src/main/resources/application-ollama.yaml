spring:
  ai:
    ollama:
      # The default endpoint where your local Ollama instance runs
      base-url: http://localhost:11434

      init:
        # Prevents the app from downloading gigabytes at startup if the model is missing
        pull-model-strategy: never
        timeout: 5m

      chat:
        # Sets the active chat model (e.g., llama3.2, llama3, mistral, deepseek-r1)
        options:
          model: deepseek-r1:latest
          temperature: 0.7

      embedding:
        # Sets the active embedding model
        options:
          model: mxbai-embed-large
