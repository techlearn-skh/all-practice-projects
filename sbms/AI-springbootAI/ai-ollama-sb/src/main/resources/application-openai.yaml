#ai-openai-sb

spring:
  application:
    name: ai-openai-sb
  ai:
    openai:
      # The default endpoint for OpenAI's public API
      base-url: https://openai.com
      # Securely read your API key from environment variables
      api-key: ${OPENAI_API_KEY:aasasas1212asas1212assasa1212sasasa}

      chat:
        # Sets the active chat model (e.g., gpt-4o, gpt-4o-mini, o1-mini)
        options:
          model: gpt-4o
          temperature: 0.7

      embedding:
        # Sets the active embedding model
        options:
          model: text-embedding-3-small
