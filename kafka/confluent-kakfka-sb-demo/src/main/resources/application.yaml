  level:
    root: WARN
    com.skh.services.KafkaConsumerService: INFO
    com.skh.services.KafkaProducerService: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
  file:
    name: ./logs/application-debug.log



